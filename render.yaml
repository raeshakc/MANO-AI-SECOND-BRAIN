# One-click deploy on Render (render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: mano
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/state
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: MANO_DATA_MODE
        value: demo
      - key: MANO_TIMEZONE
        value: America/Chicago
      - key: MANO_MAX_CALLS_PER_SESSION
        value: "15"
      - key: MANO_MAX_CALLS_PER_DAY
        value: "400"
      - key: NEBIUS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
